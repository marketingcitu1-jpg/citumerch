spring.application.name=citu-inventory

# ─── Database (XAMPP MySQL) ───────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/citu_inventory?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Change this to a strong secret in production (min 32 chars)
app.jwt.secret=citu-inventory-secret-key-2024-spring-boot-secure
app.jwt.expiration-ms=86400000
